name: Examples

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }} / Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        name: [RSpec parcel shop, Minitest workshop booking]
        ruby: ["3.3", "4.0"]
        include:
          - name: RSpec parcel shop
            directory: examples/rspec_parcel_shop
          - name: Minitest workshop booking
            directory: examples/minitest_workshop_booking
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: bundle install
      - name: Verify killed and surviving mutation examples
        run: bundle exec ruby ../verify.rb
